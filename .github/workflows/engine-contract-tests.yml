name: Engine contract tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [audit/v3-v4-engine]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile engine modules
        run: python -m py_compile services/feature_flags.py services/scoring_v3.py services/portfolio_v4.py services/engine_router.py
      - name: Run engine contract tests
        run: python -m unittest tests/test_engines_v3_v4.py
