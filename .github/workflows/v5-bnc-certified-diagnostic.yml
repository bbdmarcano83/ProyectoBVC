name: V5 BNC certified diagnostic

on:
  push:
    branches: [feature/v5-bnc-certified-closure]
    paths:
      - "scripts/diagnose_bnc_certified_v5.py"
      - ".github/workflows/v5-bnc-certified-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: "."
      SCORING_ENGINE_V5_ENABLED: "false"
      PORTFOLIO_IBC_BENCHMARK_V5_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Inspect four certified BNC audits
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.diagnose_bnc_certified_v5 | tee bnc_diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: v5-bnc-certified-diagnostic
          path: bnc_diagnostic.json
          retention-days: 7
