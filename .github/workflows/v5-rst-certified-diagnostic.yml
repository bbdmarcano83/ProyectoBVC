name: V5 RST certified diagnostic

on:
  push:
    branches:
      - feature/v5-certified-data-precedence
    paths:
      - 'services/fundamental_certifier_policy_v5.py'
      - 'services/fundamental_pdf_parser_v5.py'
      - 'services/fundamental_bvc_image_parser_v5.py'
      - 'services/fundamental_autoreview_v5.py'
      - 'services/fundamental_backfill_manifest_v5.py'
      - 'scripts/fundamental_backfill_v5.py'
      - 'scripts/diagnose_rst_fy2025_v5.py'
      - '.github/workflows/v5-rst-certified-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run read-only certified RST diagnostic
        run: |
          python scripts/diagnose_rst_fy2025_v5.py | tee rst_fy2025_certified_diagnostic.json
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: rst-fy2025-certified-diagnostic
          path: rst_fy2025_certified_diagnostic.json
          if-no-files-found: error
          retention-days: 7
