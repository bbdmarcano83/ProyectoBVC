name: V5 market close fast gate

on:
  push:
    branches: [feature/v5-universe-closure]
    paths:
      - ".github/workflows/v5-market-close-fast.yml"
      - "scripts/v5_ingest_cgq_safe.py"
      - "services/fundamental_pdf_parser_v5.py"
      - "services/fundamental_document_metadata_v5.py"
      - "tests/test_fundamental_pdf_parser_v5.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install minimum dependencies
        run: python -m pip install -r requirements.txt
      - name: Locale-aware parser regression tests
        run: python -m unittest tests.test_fundamental_pdf_parser_v5 -v
      - name: Persist bounded CGQ FY2025
        run: python scripts/v5_ingest_cgq_safe.py
      - name: Audit Neon immediately
        run: python scripts/v5_universe_closure.py --output v5_market_close_neon.json
      - uses: actions/upload-artifact@v4
        with:
          name: v5-market-close-fast
          path: |
            v5_cgq_ingest.json
            v5_market_close_neon.json
          retention-days: 7
