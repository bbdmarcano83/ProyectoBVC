name: V5 missing fundamentals diagnostic

on:
  push:
    branches: [feature/v5-missing-fundamentals-diagnostic]
    paths:
      - "scripts/diagnose_missing_fundamentals_v5.py"
      - "tests/test_missing_fundamentals_diagnostic_v5.py"
      - ".github/workflows/v5-missing-fundamentals-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: "."
      SCORING_ENGINE_V5_ENABLED: "false"
      PORTFOLIO_IBC_BENCHMARK_V5_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require external Neon secret
        shell: bash
        run: |
          case "$DATABASE_URL" in
            postgres://*|postgresql://*|postgresql+psycopg://*) ;;
            *) echo "DATABASE_URL must point to PostgreSQL/Neon"; exit 2 ;;
          esac
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install reproducible OCR runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - name: Run diagnostic unit tests
        run: python -m unittest tests.test_missing_fundamentals_diagnostic_v5
      - name: Diagnose and persist newly valid periods
        run: python scripts/diagnose_missing_fundamentals_v5.py
      - name: Audit certified universe after diagnostic
        run: python scripts/audit_fundamental_documents_v5.py --strict --require-any-sha
