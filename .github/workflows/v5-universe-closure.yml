name: V5 universe closure

on:
  push:
    branches: [feature/v5-universe-closure]
    paths:
      - ".github/workflows/v5-universe-closure.yml"
      - "scripts/v5_universe_closure.py"
      - "scripts/v5_universe_candidate_audit.py"
      - "scripts/v5_bvc_attachment_audit.py"
      - "scripts/v5_ingest_tpg_safe.py"
      - "scripts/v5_ingest_cgq_safe.py"
      - "services/fundamental_*.py"
      - "services/fx_*.py"
      - "services/bvc_attachment_adapter_v5.py"
      - "tests/test_fundamental_pdf_parser_v5.py"
      - "tests/test_fundamental_document_metadata_v5.py"
      - "tests/test_fundamental_autoreview_closure_v5.py"
      - "tests/test_bvc_attachment_adapter_v5.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-universe-closure
  cancel-in-progress: true

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require Neon
        shell: bash
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL missing" && exit 2)
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Parser, metadata, autoreview and BVC adapter regression tests
        run: |
          python -m unittest tests.test_fundamental_pdf_parser_v5 tests.test_fundamental_document_metadata_v5 -v
          python -m pytest tests/test_fundamental_autoreview_closure_v5.py tests/test_bvc_attachment_adapter_v5.py -q
      - name: Audit all registered V5 symbols against Neon and live discovery
        run: python scripts/v5_universe_closure.py --discover --output v5_universe_closure_before_ingest.json
      - name: Audit parseable official PDF candidates
        run: python scripts/v5_universe_candidate_audit.py
      - name: Audit BVC WordPress and SharePoint evidence routes
        run: python scripts/v5_bvc_attachment_audit.py
      - name: Persist bounded TPG audited snapshots
        run: python scripts/v5_ingest_tpg_safe.py
      - name: Persist bounded CGQ FY2025 audited snapshot
        run: python scripts/v5_ingest_cgq_safe.py
      - name: Re-audit Neon after bounded ingestion
        run: python scripts/v5_universe_closure.py --discover --output v5_universe_closure.json --require-asset-evaluable 32
      - name: Print fundamental coverage gaps without blocking assets
        run: |
          python - <<'PY'
          import json
          r=json.load(open('v5_universe_closure.json',encoding='utf-8'))
          print('asset_evaluable=', r['symbols_asset_evaluable'], '/', r['universe_symbols'])
          print('fundamental_ready=', r['symbols_fundamental_ready_for_scoring'], '/', r['universe_symbols'])
          for row in r['rows']:
              if not row['fundamental_ready_for_scoring']:
                  print(row['symbol'], 'status=',row['fundamental_status'],'docs=',row['documents'],'validated=',row['validated_snapshots'],'fx=',row['fx_valid'],'history=',row['history_periods_usd'],'discovered=',row['discovered_documents'],'err=',row['discovery_error'],'asset_evaluable=',row['asset_evaluable'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v5-universe-closure
          path: |
            v5_universe_closure_before_ingest.json
            v5_universe_closure.json
            v5_universe_candidates.json
            v5_bvc_attachment_audit.json
            v5_tpg_ingest.json
            v5_cgq_ingest.json
          retention-days: 14
