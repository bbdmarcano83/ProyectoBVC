name: V5 universe closure

on:
  push:
    branches: [feature/v5-universe-closure]
    paths:
      - ".github/workflows/v5-universe-closure.yml"
      - "scripts/v5_universe_closure.py"
      - "scripts/v5_universe_candidate_audit.py"
      - "scripts/fundamental_backfill_v5.py"
      - "scripts/persist_verified_pilots_v5.py"
      - "services/fundamental_*.py"
      - "services/fx_*.py"
      - "services/bvc_attachment_adapter_v5.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-universe-closure
  cancel-in-progress: false

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require Neon
        shell: bash
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL missing" && exit 2)
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Re-run idempotent verified pilot persistence
        run: python scripts/persist_verified_pilots_v5.py
      - name: Extend verified PDF history
        continue-on-error: true
        run: python scripts/fundamental_backfill_v5.py --all
      - name: Audit all registered V5 symbols against Neon and live discovery
        run: python scripts/v5_universe_closure.py --discover --output v5_universe_closure.json
      - name: Audit parseable official PDF candidates
        run: python scripts/v5_universe_candidate_audit.py
      - name: Print unresolved symbols
        run: |
          python - <<'PY'
          import json
          r=json.load(open('v5_universe_closure.json',encoding='utf-8'))
          for row in r['rows']:
              if not row['analysis_ready']:
                  print(row['symbol'], 'docs=',row['documents'],'validated=',row['validated_snapshots'],'fx=',row['fx_valid'],'history=',row['history_periods_usd'],'discovered=',row['discovered_documents'],'err=',row['discovery_error'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v5-universe-closure
          path: |
            v5_universe_closure.json
            v5_universe_candidates.json
          retention-days: 14
