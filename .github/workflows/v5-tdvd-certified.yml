name: V5 TDV.D certified diagnostic

on:
  push:
    branches: [feature/v5-tdvd-certified]
    paths:
      - "scripts/diagnose_tdvd_certified_v5.py"
      - ".github/workflows/v5-tdvd-certified.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install -r requirements.txt
      - name: Inspect TDV.D certified BVC evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.diagnose_tdvd_certified_v5 | tee tdvd_diagnostic.json
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-tdvd-certified-diagnostic
          path: tdvd_diagnostic.json
          if-no-files-found: warn
          retention-days: 14
