name: V5 RST certified backfill

on:
  push:
    branches:
      - feature/v5-certified-data-precedence
    paths:
      - 'services/fundamental_certifier_policy_v5.py'
      - 'services/fundamental_review_v5.py'
      - 'services/fundamental_backfill_manifest_v5.py'
      - 'tests/test_fundamental_review_v5.py'
      - 'scripts/persist_rst_fy2025_certified_v5.py'
      - '.github/workflows/v5-rst-certified-backfill.yml'
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require production Neon secret
        shell: bash
        run: |
          test -n "$DATABASE_URL"
      - name: Install dependencies and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run certified precedence regression tests
        run: |
          python -m unittest tests.test_certifier_policy_v5 tests.test_fundamental_review_v5
      - name: Persist RST FY2025 from certified BVC evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.persist_rst_fy2025_certified_v5 | tee rst_fy2025_backfill.json
      - name: Reaudit Neon integrity
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_fundamental_documents_v5 --strict --require-any-sha | tee fundamental_document_audit_after_rst.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rst-fy2025-certified-backfill
          path: |
            rst_fy2025_backfill.json
            fundamental_document_audit_after_rst.json
          if-no-files-found: warn
          retention-days: 14
