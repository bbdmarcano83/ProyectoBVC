name: V5 net income closure

on:
  push:
    branches: [feature/v5-net-income-diagnostic]
    paths:
      - "scripts/diagnose_net_income_candidates_v5.py"
      - "scripts/persist_exact_net_income_v5.py"
      - ".github/workflows/v5-net-income-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: "."
      SCORING_ENGINE_V5_ENABLED: "false"
      PORTFOLIO_IBC_BENCHMARK_V5_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require external Neon secret
        shell: bash
        run: |
          case "$DATABASE_URL" in
            postgres://*|postgresql://*|postgresql+psycopg://*) ;;
            *) echo "DATABASE_URL must point to PostgreSQL/Neon"; exit 2 ;;
          esac
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect certified net-income candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.diagnose_net_income_candidates_v5 | tee net_income_candidates.json
      - name: Persist exact certified net-income rows
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.persist_exact_net_income_v5 | tee exact_net_income_backfill.json
      - name: Reaudit certified universe
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_fundamental_documents_v5 --strict --require-any-sha | tee net_income_closure_audit.json
      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-net-income-closure
          path: |
            net_income_candidates.json
            exact_net_income_backfill.json
            net_income_closure_audit.json
          if-no-files-found: warn
          retention-days: 14
