name: V5 fundamental document audit

on:
  push:
    branches: [feature/v5-philosophy-engine]
    paths:
      - ".github/workflows/v5-fundamental-document-audit.yml"
      - "scripts/audit_fundamental_documents_v5.py"
      - "scripts/fundamental_backfill_v5.py"
      - "services/fundamental_store_v5.py"
      - "services/fundamental_review_v5.py"
      - "services/fundamental_pdf_parser_v5.py"
      - "services/fundamental_backfill_manifest_v5.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-fundamental-document-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      SCORING_ENGINE_V3_ENABLED: "true"
      SCORING_ENGINE_V5_ENABLED: "false"
      PORTFOLIO_ENGINE_V4_ENABLED: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require external Neon secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured in GitHub Actions."
            exit 2
          fi
          python - <<'PY'
          import os
          value = os.environ.get("DATABASE_URL", "")
          if not value.startswith(("postgres://", "postgresql://", "postgresql+psycopg://")):
              raise SystemExit("DATABASE_URL must be PostgreSQL/Neon")
          print("External PostgreSQL secret detected; value intentionally not printed.")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify V5 remains disabled
        run: |
          python - <<'PY'
          import os
          assert os.environ.get("SCORING_ENGINE_V5_ENABLED", "").lower() == "false"
          print("V5 scoring remains disabled during provenance audit")
          PY

      - name: Audit persisted document provenance
        run: python scripts/audit_fundamental_documents_v5.py --strict --require-any-sha
